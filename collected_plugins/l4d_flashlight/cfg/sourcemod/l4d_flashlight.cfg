// [L4D & L4D2] Flashlight Package - 死亡生还者观察用配置
// 目标: 活着的玩家不能用, 只有死亡的生还者可以用个人手电.

// 0=关闭插件, 1=启用插件
l4d_flashlight_allow "1"

// 活着的玩家可用范围: 0=都不能用
// 原说明: 1=生还者, 2=感染者, 3=全部
l4d_flashlight_users "0"

// 死亡/旁观状态个人手电: 2=死亡生还者
// 原说明: 0=关闭, 1=旁观者, 2=生还者, 4=感染者, 7=全部
l4d_flashlight_spec "2"

// 不要进服/复活后默认给活人开灯
l4d_flashlight_default "0"

// 不保存玩家上次灯光开关状态, 避免复用旧偏好导致判断混乱
l4d_flashlight_save "0"

// 关闭提示和入服介绍, 减少聊天框刷屏
l4d_flashlight_hints "0"
l4d_flashlight_intro "0"

// 关闭彩虹灯, 保持观察用途朴素一点
l4d_flashlight_rainbow "0"

// 默认颜色和亮度
l4d_flashlight_colour "255 255 255"
l4d_flashlight_bright "255.0"
