// 是否启用根据路程动态减难。0=关闭，1=开启。
l4d2_flow_difficulty_enable "1"

// 低于该路程百分比的团灭计入第一阶阈值。
l4d2_flow_difficulty_early_percent "75.0"

// 第一阶投票所需的早期团灭次数。
l4d2_flow_difficulty_tier1_wipes "2"

// 第二阶投票所需的总团灭次数。
l4d2_flow_difficulty_tier2_wipes "5"

// 第三阶满血复活投票所需的总团灭次数。
l4d2_flow_difficulty_tier3_wipes "7"

// 连续多少次团灭无法取得路程后，启用导航备用模式。
l4d2_flow_difficulty_fallback_invalid_wipes "3"

// 导航备用模式下，第一阶投票所需的总团灭次数。
l4d2_flow_difficulty_fallback_tier1_wipes "4"

// 投票持续时间。所有投票开始时在线的真人都投票，本次投票才有效。
l4d2_flow_difficulty_vote_time "25"

// 第二阶复活真人时给予的实血。
l4d2_flow_difficulty_revive_health "50"

// 每回合开始多少秒后，为没有主武器的存活真人显示随机基础主武器领取菜单。
l4d2_flow_difficulty_weapon_offer_delay "30.0"
