// L4D2 多特经验分评定插件配置
// 放到服务器: left4dead2/cfg/sourcemod/l4d2_multisi_experience.cfg

// 0=本图不记录、不结算、不保存经验分, 1=开启计分
// 适合坑图、机关图、反复重开测试图临时关闭.
// 管理员也可以在聊天框输入 !mexp_enable 打开菜单, 或 !mexp_enable 0/1 快速切换.
// 注意: cvar 会持续生效, 离开这些图后需要在正常图 cfg 里重新设回 1.
l4d2_mexp_enable "1"

// 0=Bot 不参与评分/排行/长期经验, 1=Bot 也参与
// 建议保持 0, 避免电脑影响榜单.
l4d2_mexp_include_bots "0"

// 至少多少个有效玩家才结算.
// 默认 2: Bot 不算有效玩家, 1 个真人 + 3 个电脑不会结算.
l4d2_mexp_min_players "2"

// 参与时间要求: min(120秒, max(15秒, 本关时长 * 0.5))
l4d2_mexp_min_play_time "120.0"
l4d2_mexp_min_play_ratio "0.5"
l4d2_mexp_min_play_floor "15.0"

// 本关评分范围和默认权重
// 当前使用 600 分上限, 长期经验会大致趋近 0-6000 区间.
l4d2_mexp_base_score "100.0"
l4d2_mexp_score_min "0.0"
l4d2_mexp_score_max "600.0"
l4d2_mexp_score_softcap "350.0"
l4d2_mexp_score_softcap_scale "0.5"

// 加分项
l4d2_mexp_w_si_damage "0.01"
l4d2_mexp_w_si_kill "0.2"
l4d2_mexp_w_common_kill "0.14"
l4d2_mexp_w_clear "12.0"
l4d2_mexp_w_revive "5.0"
l4d2_mexp_w_defib "12.0"

// 承压: 被特感控住后没有倒地/死亡, 最终被救下或控制结束.
// 用来补偿前排开路玩家吃控较多的问题.
l4d2_mexp_w_control_survive "3.5"

// Tank/Witch/石头轻量奖励
// 小僵尸默认 10 只 +1 分; Tank 伤害默认 1000 伤 +1 分.
l4d2_mexp_w_tank_damage "0.003"
l4d2_mexp_w_tank_kill "5.0"
l4d2_mexp_w_tank_top_damage "10.0"
l4d2_mexp_w_witch_kill "5.0"
l4d2_mexp_w_rock_destroy "3.0"

// 生还者技巧性动作奖励: 数据来自 l4d2_skill_detect.smx.
// 没有单独的技巧分上限; 技巧分仍会经过本关软压缩和总分硬上限.
// 秒救是原有清控分之外的小额速度奖励, 不会再重复增加一次清控次数.
l4d2_mexp_w_skeet "1.0"
l4d2_mexp_w_melee_skeet "2.0"
l4d2_mexp_w_tongue_cut "0.5"
l4d2_mexp_w_hunter_deadstop "0.2"
l4d2_mexp_w_charger_level "0.2"
l4d2_mexp_w_fast_clear "0.8"
l4d2_mexp_w_smoker_self_clear "0.6"
l4d2_mexp_fast_clear_time "0.75"

// 武器伤害分倍率: 只影响特感伤害和 Tank 伤害这类伤害分, 不影响救控/救人/击杀次数.
// 未列出的武器默认 1.0; 近战、榴弹/爆炸类武器保持正常计算.
l4d2_mexp_weapon_mult_smg "1.3"
l4d2_mexp_weapon_mult_smg_silenced "1.25"
l4d2_mexp_weapon_mult_pumpshotgun "1.25"
l4d2_mexp_weapon_mult_shotgun_chrome "1.25"
l4d2_mexp_weapon_mult_mp5 "1.17"
l4d2_mexp_weapon_mult_sg552 "1.14"
l4d2_mexp_weapon_mult_rifle "0.84"
l4d2_mexp_weapon_mult_rifle_desert "0.84"
l4d2_mexp_weapon_mult_rifle_ak47 "0.87"
l4d2_mexp_weapon_mult_autoshotgun "0.8"
l4d2_mexp_weapon_mult_shotgun_spas "0.8"
l4d2_mexp_weapon_mult_hunting_rifle "0.9"
l4d2_mexp_weapon_mult_sniper_military "0.75"
l4d2_mexp_weapon_mult_sniper_scout "0.70"
l4d2_mexp_weapon_mult_sniper_awp "0.65"

// 大枪持用时间衰减: 影响 M16、SCAR、AK47、四类狙击枪和两把连喷的特感/Tank 伤害分.
// 每位玩家、每个枪种独立计时; 当前拿在手上时每秒增加 1 秒, 换下后按恢复速率回退.
// 步枪/狙击: 120 秒内完整倍率, 120-420 秒线性降低, 420 秒归零.
// 两把连喷: 180 秒内完整倍率, 180-600 秒线性降低, 600 秒归零.
// 换同类武器不会重置; 小枪、M60、榴弹、近战和爆炸类武器不参与衰减.
// 衰减/归零提示发出后, 枪种需恢复到对应阈值以下 20 秒才允许再次提示.
l4d2_mexp_weapon_decay_enable "1"
l4d2_mexp_weapon_decay_start "120.0"
l4d2_mexp_weapon_decay_zero "420.0"
l4d2_mexp_weapon_decay_autoshotgun_start "180.0"
l4d2_mexp_weapon_decay_autoshotgun_zero "600.0"
l4d2_mexp_weapon_decay_recovery_rate "1.0"
l4d2_mexp_weapon_decay_notify_rearm_buffer "20.0"

// 有效命中率小额奖励: 低于 10% 不加分, 10%-20% +1, 20%-30% +2, 最高 +8.
// 需要达到最低开火次数, 避免少开火故意刷命中率.
l4d2_mexp_w_accuracy_step "1.0"
l4d2_mexp_accuracy_min_shots "80"
l4d2_mexp_accuracy_floor "0.10"
l4d2_mexp_accuracy_step "0.10"
l4d2_mexp_accuracy_max_bonus "8.0"

// 杀死控人特感时, 若控人状态刚刚被游戏事件清掉, 仍允许在该窗口内算作救控.
l4d2_mexp_clear_recent_window "1.0"

// 扣分项
l4d2_mexp_p_control "1.5"
l4d2_mexp_p_control_time "0.4"
l4d2_mexp_p_incap "20.0"
l4d2_mexp_p_death "50.0"
l4d2_mexp_saferoom_incap_scale "0.10"
l4d2_mexp_saferoom_death_scale "0.10"
l4d2_mexp_p_ff_damage "0.10"
l4d2_mexp_p_rock_hit "10.0"
l4d2_mexp_p_tank_punch "4.0"
l4d2_mexp_p_tank_hittable "15.0"
l4d2_mexp_p_spit_damage "0.15"

// 是否回合结束后播报本关评分
l4d2_mexp_announce "1"

// 玩家连接服务器后, 是否在左下角聊天框全服播报长期经验分
l4d2_mexp_join_announce "1"

// 进服后延迟多少秒提示经验分
l4d2_mexp_join_announce_delay "5.0"

// 是否保存长期经验到 addons/sourcemod/data/l4d2_multisi_exp.txt
l4d2_mexp_save "1"

// 长期经验初始值与更新权重
l4d2_mexp_default_rating "1000.0"
l4d2_mexp_rating_weight "0.006"

// 个人输入 !mexp 时显示服务器经验分排名; 至少达到该有效关卡数才上榜.
// 排名不会在玩家进服时播报. 设为 0 可让所有存档记录参与排名.
l4d2_mexp_rank_min_rounds "5"

// 短图保护: 短图仍播报本关评分, 但降低或跳过长期经验变化.
// 低于 300 秒: 长期经验不变; 300-600 秒: 从 25% 权重逐渐提高到 100%; 600 秒以上: 正常权重.
l4d2_mexp_short_round_skip_time "300.0"
l4d2_mexp_short_round_full_time "600.0"
l4d2_mexp_short_round_min_weight_scale "0.25"

// 过关低分保护: 成功过关但团队均分偏低时, 只降低掉分影响, 不降低加分.
// 用来缓解简单图、怪少图打完全队低分导致长期经验普遍下降的问题.
l4d2_mexp_win_low_team_score_floor "180.0"
l4d2_mexp_win_low_score_negative_scale "0.25"

// 终点阶段安全屋外事故保护: 有人进终点安全屋后, 其他人在安全屋外倒地/死亡.
// 如果最终成功过关, 只降低这些玩家的长期掉分影响; 本关倒地/死亡扣分仍正常计算.
l4d2_mexp_endgame_outside_death_guard "1"
l4d2_mexp_endgame_outside_death_negative_scale "0.50"
