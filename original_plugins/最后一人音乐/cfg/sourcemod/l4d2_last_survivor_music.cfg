// 最后一人音乐，作者：night。

// 是否启用。歌曲需要同时部署到游戏服务器和 FastDL。
l4d2_lsm_enable "1"

// 音量，0.0 到 1.0；下次播放生效。
l4d2_lsm_volume "0.45"

// 淡入时间，单位秒。0=直接使用目标音量。
l4d2_lsm_fade_in "1.5"

// 淡出时间，单位秒。0=立即停止；换图、新回合和卸载插件仍立即清理。
l4d2_lsm_fade_out "1.0"

// 最后一人状态持续时，歌曲结束后自动随机下一首；只有一首时重播。
// 需要曲库中填写 duration。0=本次最后一人状态只播放一首。
l4d2_lsm_repeat "1"

// 触发时是否向全体真人提示最后站立者和歌曲名。
l4d2_lsm_announce "1"
